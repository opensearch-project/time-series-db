    # -----------------------------------------------------------------------
    # burnRate
    # -----------------------------------------------------------------------

    - name: "empty_series"
      type: "m3ql"
      indices: "burn_rate_test"
      query: "total = fetch name:total_empty; fetch name:errors_empty | burnRate(total) 5m 99.9"
      time_config:
        min_timestamp: "2025-01-01T00:05:00Z"
        max_timestamp: "2025-01-01T00:10:00Z"
        step: "1m"
      expected:
        status: "success"
        data: []

    - name: "burnRate_5s_99.9"
      type: "m3ql"
      indices: "burn_rate_test"
      query: "total = fetch name:total_5s_999; fetch name:errors_5s_999 | burnRate(total) 5m 99.9"
      time_config:
        min_timestamp: "2025-01-01T00:05:00Z"
        max_timestamp: "2025-01-01T00:10:00Z"
        step: "1m"
      expected:
        status: "success"
        data:
          - metric: {name: "errors_5s_999", type: "ratios"}
