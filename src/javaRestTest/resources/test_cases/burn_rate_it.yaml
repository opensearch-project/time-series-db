---
# Integration tests for burnRate, burnRateMultiplier, and multiBurnRate functions.

test_setup:
  name: "Burn Rate Function Tests"
  description: "Integration tests for burnRate, burnRateMultiplier, and multiBurnRate (aligned with Go burn_rate tests)."

  index_configs:
    - name: "burn_rate_test"
      shards: 1
      replicas: 0

test_case:
  name: "Burn Rate Tests"

  validation:
    tolerance: 0.000001

  input_data_list:
    - index_name: "burn_rate_test"
      input_data_type: FIXED_INTERVAL
      time_config:
        min_timestamp: "2025-01-01T00:00:00Z"
        max_timestamp: "2025-01-01T00:20:00Z"
        step: "1m"
      regular_metrics:
